name: Security Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Monday 9:00 UTC

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Build govulncheck for the runner itself; GOOS is set only when it
      # analyzes, so the Windows-only files are checked too.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # Reports only vulnerabilities in code paths the module actually calls.
      - name: govulncheck (linux)
        run: govulncheck ./...
      - name: govulncheck (windows)
        run: GOOS=windows govulncheck ./...
